 if(st=='end'){drawEnd();return}
 cam=st=='home'?0:Math.max(0,px-90);scene();
 for(const o of OB){if(o.hit)continue;const sx=o.x-cam;if(sx<-50||sx>W+10)continue;const by=GY-o.h;
  if(o.t=='box'){blk(sx,by,o.w,o.h,'#d8423a');cr(sx+10,by-4,12,4,'#1b2336')}
  else if(o.t=='tire'){X.fillStyle='#1b2336';X.beginPath();X.arc(sx+14,GY-14,14,0,7);X.fill();X.fillStyle='#444';X.beginPath();X.arc(sx+14,GY-14,10,0,7);X.fill();X.fillStyle='#bbb';X.beginPath();X.arc(sx+14,GY-14,4,0,7);X.fill()}
  else{X.fillStyle='#1b2336';X.beginPath();X.moveTo(sx-1,GY);X.lineTo(sx+9,by-1);X.lineTo(sx+19,GY);X.fill();X.fillStyle='#ff7a1a';X.beginPath();X.moveTo(sx+3,GY-2);X.lineTo(sx+9,by+4);X.lineTo(sx+15,GY-2);X.fill();cr(sx+5,GY-14,8,4,'#fff')}}
 for(const c of CRS){const sx=c.x-cam;if(sx<-50||sx>W+10)continue;const by=GY-92+(c.done?0:Math.sin(time*3+c.i)*3);
  if(!c.done){X.fillStyle='rgba(255,230,80,'+(.25+.15*Math.sin(time*5))+')';X.beginPath();X.arc(sx+19,by+19,30,0,7);X.fill()}
  blk(sx,by,38,38,c.done?'#a8753a':'#c98a3e');X.fillStyle='#8a5a22';for(let i=1;i<4;i++)X.fillRect(sx+3,by+i*9,32,2);
  X.fillStyle='#b8c0c8';[[2,2],[30,2],[2,30],[30,30]].forEach(p=>X.fillRect(sx+p[0],by+p[1],6,6));
  X.font='900 28px sans-serif';X.textAlign='center';X.lineWidth=4;X.strokeStyle='#1b2336';X.fillStyle='#ffe14d';const ch=c.done?'✓':'?';X.strokeText(ch,sx+19,by+29);X.fillText(ch,sx+19,by+29);
  if(c.done){cr(sx-4,by-10,46,8,'#c98a3e');X.strokeStyle='#1b2336';X.lineWidth=2;X.strokeRect(sx-4,by-10,46,8)}}
 for(const c of COINS){if(c.got)continue;const sx=c.x-cam;if(sx<-20||sx>W+20)continue;const cy=GY-c.y+Math.sin(time*4+c.x)*1.5;X.fillStyle='#1b2336';X.beginPath();X.arc(sx,cy,10,0,7);X.fill();X.fillStyle='#ffc61a';X.beginPath();X.arc(sx,cy,8,0,7);X.fill();X.fillStyle='#fff3a0';X.fillRect(sx-5,cy-5,3,3);X.fillStyle='#8a5a00';X.font='900 9px sans-serif';X.textAlign='center';X.fillText('99',sx,cy+3)}
 for(const e of ENS){if(e.warn>0&&Math.floor(time*8)%2){const wy=GY-(e.k=='ball'?40:30);X.fillStyle='#1b2336';X.beginPath();X.moveTo(W-44,wy+22);X.lineTo(W-18,wy+22);X.lineTo(W-31,wy-4);X.fill();X.fillStyle='#ffcf2e';X.beginPath();X.moveTo(W-39,wy+19);X.lineTo(W-23,wy+19);X.lineTo(W-31,wy+2);X.fill();X.fillStyle='#1b2336';X.font='900 14px sans-serif';X.textAlign='center';X.fillText('!',W-31,wy+17)}
  if(!e.on)continue;const sx=e.x-cam;
  if(e.k=='ball'){X.fillStyle='#1b2336';X.beginPath();X.arc(sx,GY-22,11,0,7);X.fill();X.fillStyle='#ff8fb3';X.beginPath();X.arc(sx,GY-22,9,0,7);X.fill();cr(sx-9,GY-23,18,3,'#fff')}
  else{X.save();X.translate(sx,GY-13);X.rotate(-time*6);X.fillStyle='#1b2336';X.beginPath();X.arc(0,0,14,0,7);X.fill();X.fillStyle='#555';X.beginPath();X.arc(0,0,9,0,7);X.fill();X.fillStyle='#ddd';X.fillRect(-9,-1,18,2);X.fillRect(-1,-9,2,18);X.restore()}}
 if(st!='home'){const pose=st=='quiz'?'think':hurtT>0?'hurt':y>0?'jump':st=='tut'?'stand':'run';
  X.globalAlpha=inv>0&&Math.floor(time*12)%2?.35:1;hero(X,px-cam,GY-y,pose,time,1);X.globalAlpha=1}
 for(const p of parts){X.fillStyle=p.c;X.fillRect(p.x-cam,p.y,4,4)}
 X.font='900 16px sans-serif';X.textAlign='center';X.lineWidth=3;for(const f of floats){X.strokeStyle='#1b2336';X.fillStyle='#ffe14d';X.strokeText(f.t,f.x-cam,f.y);X.fillText(f.t,f.x-cam,f.y)}}
function drawEnd(){const t=endT;cam=END-260;scene();
 for(let i=0;i<3;i++)hero(X,40+i*32,GY,'salute',t,1);
 const jx=200+(t>1?18*(t-1)**2:0),lift=t>3.2?45*(t-3.2)**2:0,ang=t>3?-Math.min(.4,(t-3)*.35):0;
 jet(X,jx,GY-21-lift,1.1,ang,t<3.4);
 if(t>5.2){X.font='900 36px sans-serif';X.textAlign='center';X.lineWidth=6;X.strokeStyle='#1b2336';X.fillStyle='#ffe14d';X.strokeText('榮耀起飛！',W/2,110);X.fillText('榮耀起飛！',W/2,110)}}
/* game */
const hud=()=>{$('hv').textContent='❤'.repeat(hearts)+'🖤'.repeat(3-hearts)+' 🪙'+coinN+' 🎖'+badges+'/6 ★'+score};
function ban(t){const b=$('ban');b.textContent=t;b.classList.add('on');clearTimeout(bt);bt=setTimeout(()=>b.classList.remove('on'),1900)}
function reset(){px=60;y=0;vy=0;hearts=3;score=0;coinN=0;badges=0;firstOK=0;inv=0;hurtT=0;jb=0;tutDone=false;segShown=[0,0,0];parts=[];floats=[];
 COINS.forEach(c=>c.got=false);CRS.forEach(c=>c.done=false);OB.forEach(o=>o.hit=false);ENS.forEach(e=>{e.started=false;e.warn=0;e.on=false});hud()}
function begin(){$('home').classList.remove('on');$('res').classList.remove('on');$('skip').style.display='none';reset();st='play';resumeAt=performance.now()}
function tryJump(){if(performance.now()-resumeAt<250)return;
 if(st=='tut'){st='play';tutDone=true;$('hint').classList.remove('on');vy=VJ;y=.01;snd(520,.1)}else if(st=='play')jb=.12}
const sg=()=>px>=SX[2]?2:px>=SX[1]?1:0;
function dmg(){if(inv>0)return false;hearts--;inv=2;hurtT=.6;snd(170,.25,.05);hud();if(hearts<=0){st='over';$('over').classList.add('on')}return true}
const hitR=(a,b,c,d)=>px+8>a&&px-8<b&&y+38>c&&y+2<d;
function upd(dt){
 px+=SP*dt;cam=Math.max(0,px-90);
 if(inv>0)inv-=dt;if(hurtT>0)hurtT-=dt;if(jb>0)jb-=dt;
 if(jb>0&&y<=0&&vy<=0){vy=VJ;y=.01;jb=0;snd(520,.1)}
 if(y>0||vy>0){vy-=G*dt;y+=vy*dt;if(y<=0){y=0;vy=0}}
 if(!tutDone&&px>=OB[0].x-28){px=OB[0].x-28;st='tut';$('hint').classList.add('on');return}
 const s=sg();if(!segShown[s]){segShown[s]=1;ban(['第一段・校園出發','第二段・機棚實習','第三段・跑道榮耀'][s])}
 for(const c of CRS)if(!c.done&&px>=c.x-70){px=c.x-70;openQuiz(c);return}
 for(const c of COINS)if(!c.got&&Math.abs(c.x-px)<14&&c.y>y-6&&c.y<y+46){c.got=true;coinN++;score+=10;floats.push({t:'+10',x:c.x,y:GY-c.y-10,l:.8});for(let i=0;i<6;i++)parts.push({x:c.x,y:GY-c.y,vx:(Math.random()-.5)*120,vy:-Math.random()*100,l:.5,c:'#ffd84a'});snd(1300,.1,.04);setTimeout(()=>snd(1800,.12,.035),70);hud()}
 OB.forEach((o,i)=>{if(!o.hit&&i>0&&hitR(o.x+3,o.x+o.w-3,0,o.h-3)&&dmg())o.hit=true});
 for(const e of ENS){if(!e.started&&px>=e.t){e.started=true;e.warn=1}
  if(e.warn>0){e.warn-=dt;if(e.warn<=0){e.on=true;e.x=cam+W+30}}
  if(e.on){e.x-=(e.k=='ball'?100:130)*dt;const r=e.k=='ball'?[e.x-9,e.x+9,12,32]:[e.x-12,e.x+12,0,26];if(hitR(...r)&&dmg())e.on=false;if(e.x<cam-40)e.on=false}}
 for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=300*dt;p.l-=dt}parts=parts.filter(p=>p.l>0);
 for(const f of floats){f.y-=30*dt;f.l-=dt}floats=floats.filter(f=>f.l>0);
 if(px>=END&&st=='play'){st='end';endT=0;score+=990;hud();$('skip').style.display='block';snd(660,.2);setTimeout(()=>snd(880,.3),180)}}
/* quiz */
function openQuiz(c){st='quiz';qc=c;tries=0;const q=QS[c.i];$('qn').textContent='木箱挑戰 '+(c.i+1)+'/6';$('qq').textContent=q.q;$('qfb').textContent='';$('qgo').style.display='none';
 const bx=$('qopts');bx.innerHTML='';sh([0,1,2]).forEach(id=>{const b=document.createElement('button');b.className='opt';b.textContent=q.o[id];b.dataset.id=id;b.onclick=()=>answer(b,id);bx.appendChild(b)});$('quiz').classList.add('on')}
function answer(b,id){if(st!='quiz'||qc.done)return;const q=QS[qc.i];
 if(id===0){const f=tries==0;score+=f?99:66;if(f)firstOK++;qc.done=true;badges++;hearts=Math.min(3,hearts+1);hud();
  document.querySelectorAll('.opt').forEach(x=>x.disabled=true);b.classList.add('good');
  $('qfb').innerHTML='✅ 答對了！'+(f?'+99分':'+66分')+'<br>'+q.e+'<br>🎖 獲得整備徽章，愛心恢復！'+ENC[qc.i];$('qgo').style.display='block';snd(880,.15);setTimeout(()=>snd(1180,.25),120)}
 else{tries++;b.disabled=true;b.classList.add('bad');$('qfb').textContent='💡 差一點點，再想想看，你可以的！';snd(300,.15,.03)}}
/* result */
const ttl=()=>firstOK==6?'空機99・王牌整備官':firstOK>=4?'空機99・飛鷹勇士':'空機99・同袍齊心';
function showResult(){st='result';$('skip').style.display='none';
 if(score>SV.best){SV.best=score;save()}
 const c=$('cardc').getContext('2d'),g=c.createLinearGradient(0,0,0,270);g.addColorStop(0,'#3f8fe0');g.addColorStop(1,'#cdeeff');c.fillStyle=g;c.fillRect(0,0,320,270);
 c.fillStyle='rgba(255,255,255,.85)';c.fillRect(20,100,60,10);c.fillRect(240,60,50,10);
 emblem(c,160,50,38);jet(c,175,140,1.15,-.1,false);
 c.fillStyle='#6a7480';c.fillRect(0,245,320,25);c.fillStyle='#1b2336';c.fillRect(0,245,320,3);
 hero(c,70,245,'salute',0,2.4);
 c.fillStyle='#1b2336';c.font='900 16px sans-serif';c.textAlign='center';c.fillText('空機99',230,230);
 $('rn').textContent='飛行員：'+name;$('rt').textContent=ttl();
 $('rs').innerHTML='🪙 金幣 '+coinN+' 枚<br>🎖 首次答對 '+firstOK+'/6（6題全數完成）<br>★ 總分 '+score+'（最高 '+SV.best+'）';
 $('res').classList.add('on')}
function copy(){const t='我完成了《空機99・飛鷹冒險》，收集'+coinN+'枚金幣，首次答對'+firstOK+'題，獲得'+score+'分，榮獲'+ttl()+'！空機九九，友誼歷久彌堅！';
 const ok=()=>{$('cp').textContent='已複製 ✔';setTimeout(()=>$('cp').textContent='複製戰績',1500)};
 function fb(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){prompt('請手動複製',t)}a.remove()}
 if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,fb);else fb()}
/* events (registered once) */
$('jump').addEventListener('pointerdown',e=>{e.preventDefault();tryJump()});
document.addEventListener('keydown',e=>{if(e.code=='Space'||e.code=='ArrowUp'){if(document.activeElement&&document.activeElement.tagName=='INPUT')return;e.preventDefault();if(!e.repeat)tryJump()}});
document.addEventListener('contextmenu',e=>e.preventDefault());
$('nick').value=SV.name||'';$('best').textContent=SV.best?'最高分：'+SV.best:'';
$('start').onclick=()=>{name=$('nick').value.trim()||'同袍';SV.name=name;save();snd(600,.08);begin()};
$('qgo').onclick=()=>{$('quiz').classList.remove('on');for(let i=0;i<8;i++)parts.push({x:qc.x+19,y:GY-90,vx:(Math.random()-.5)*160,vy:-120-Math.random()*80,l:.8,c:i%2?'#ffd84a':'#8fd3ff'});floats.push({t:'🎖+1',x:qc.x+19,y:GY-100,l:1.2});st='play';resumeAt=performance.now()};
$('cont').onclick=()=>{const s=sg();px=s?SX[s]:60;hearts=3;y=0;vy=0;inv=1.2;hurtT=0;OB.forEach(o=>o.hit=false);ENS.forEach(e=>{e.on=false;e.warn=0;e.started=e.t<px});segShown[s]=0;hud();$('over').classList.remove('on');st='play';resumeAt=performance.now()};
$('skip').onclick=()=>{if(st=='end')showResult()};
$('again').onclick=begin;$('cp').onclick=copy;
$('homeb').onclick=()=>{$('res').classList.remove('on');$('home').classList.add('on');$('best').textContent=SV.best?'最高分：'+SV.best:'';st='home'};
$('mute').textContent=mute?'🔇':'🔊';
$('mute').onclick=()=>{mute=!mute;SV.mute=mute;save();$('mute').textContent=mute?'🔇':'🔊'};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&(st=='play'||st=='tut'||st=='end')){prev=st;st='pause';$('pause').classList.add('on')}});
$('resume').onclick=()=>{$('pause').classList.remove('on');st=prev||'play';resumeAt=performance.now()};
/* single loop */
let last=0;
function loop(t){const dt=Math.min(.033,Math.max(0,(t-last)/1000||0));last=t;time+=dt;
 if(st=='play')upd(dt);else if(st=='end'){endT+=dt;if(endT>=6.5)showResult()}
 draw();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
})();
</script></body></html>
